services:
  novu-api:
    image: ghcr.io/novuhq/novu/api:3.17.0
    container_name: infra-novu-api
    environment:
      NODE_ENV: production
      API_ROOT_URL: http://localhost:3000
      PORT: 3000
      MONGO_URL: mongodb://root:secret@mongodb:27017/novu-db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY}
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/v1/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:3.17.0
    container_name: infra-novu-worker
    environment:
      MONGO_URL: mongodb://root:secret@mongodb:27017/novu-db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongodb
      - redis
    networks:
      - infra-net

  novu-ws:
    image: ghcr.io/novuhq/novu/ws:3.17.0
    container_name: infra-novu-ws
    environment:
      PORT: 3002
      MONGO_URL: mongodb://root:secret@mongodb:27017/novu-db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
      - redis
    networks:
      - infra-net

  novu-dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.17.0
    container_name: infra-novu-dashboard
    environment:
      VITE_API_HOSTNAME: http://localhost:3000
      VITE_WEBSOCKET_HOSTNAME: http://localhost:3002
    ports:
      - "4000:4000"
    depends_on:
      - novu-api
      - novu-worker
    networks:
      - infra-net