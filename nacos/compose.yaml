services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: infra-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nacos_data:
    name: infra_nacos_data