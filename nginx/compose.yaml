services:
  nginx:
    image: nginx:alpine
    container_name: infra-nginx
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - nginx_www:/usr/share/nginx/html
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nginx_www:
    name: infra_nginx_www
