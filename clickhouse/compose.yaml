services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: infra-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  clickhouse_data:
    name: infra_clickhouse_data