services:
  localstack:
    image: localstack/localstack:0.14.5
    container_name: infra-localstack
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/tmp/localstack
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  localstack_data:
    name: infra_localstack_data