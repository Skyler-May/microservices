services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: infra-etcd
    environment:
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    ports:
      - "2379:2379"
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  apisix:
    image: apache/apisix:3.7.0-debian
    container_name: infra-apisix
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9180:9180"
    environment:
      - APISIX_STANDALONE=false
    volumes:
      - ./apisix_config.yaml:/usr/local/apisix/conf/config.yaml:ro
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/apisix/status"]
      interval: 30s
      timeout: 5s
      retries: 3
