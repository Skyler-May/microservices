services:
  minio:
    image: minio/minio:latest
    container_name: infra-minio
    command: server /data --console-address ":9001"
    ports:
      - "9005:9000"   # S3 API（原 9000 被占用，改 9005）
      - "9006:9001"   # Console UI
    volumes:
      - minio_data:/data
    networks:
      - infra-net
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio123456
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  minio_data:
    name: infra_minio_data
